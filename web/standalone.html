<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆库 · 本机工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23203f78'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --card-2:#fbfcfe; --line:#dfe4ec; --line-2:#eaeef4;
  --text:#1d2733; --muted:#5d6b7d; --faint:#8b97a8;
  --accent:#203f78; --accent-2:#2f5aa8; --accent-soft:#e8eef9;
  --chip:#eef2f8; --green:#1a7f4b; --green-soft:#e6f4ec; --red:#b4342a; --red-soft:#fceae8;
  --orange:#9a5f14; --orange-soft:#fbf1e0; --shadow:0 1px 2px rgba(16,26,42,.05),0 8px 24px rgba(16,26,42,.05);
  --radius:12px; --radius-sm:8px;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#111419; --card:#191d24; --card-2:#1d222a; --line:#2b323c; --line-2:#242a33;
  --text:#e7ebf1; --muted:#a3aebd; --faint:#7b8798;
  --accent:#86aaf0; --accent-2:#a8c3f6; --accent-soft:#1e2836;
  --chip:#232a34; --green:#63c68f; --green-soft:#16281f; --red:#ef8b80; --red-soft:#2c1a19;
  --orange:#e0b070; --orange-soft:#2a2217; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:20px}h2{font-size:15px}h3{font-size:13px}
p{margin:0}
a{color:var(--accent-2);text-decoration:none}
code,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
input,select,textarea,button{outline-offset:2px}

/* ---------- gate ---------- */
#gate{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
#boot-screen{height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px;letter-spacing:.02em}
.gate{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.gate h1{font-size:19px;display:flex;align-items:center;gap:9px}
.gate .sub{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.65}
.gate form{margin-top:20px;display:grid;gap:12px}
.gate .row{display:flex;gap:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 auto;box-shadow:0 0 0 3px var(--green-soft)}
.dot.off{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}

.field{display:grid;gap:6px}
.field>label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.inp{width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
textarea.inp{resize:vertical;min-height:88px;line-height:1.6}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--faint) 50%),linear-gradient(-45deg,transparent 49%,var(--faint) 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 12px;font-size:13px;font-weight:600;transition:background .15s,border-color .15s,transform .06s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme=dark] .btn.primary{color:#0d1117}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{padding:4px 9px;font-size:12px}

/* ---------- app shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:650;font-size:15px;white-space:nowrap}
.brand span{font-size:11px;font-weight:500;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
header .spacer{flex:1}
header .hp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
header select{background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 8px;font-size:12.5px}
@media(max-width:640px){header{flex-wrap:wrap;row-gap:8px;padding:10px 12px}header .spacer{display:none}header select{max-width:min(190px,44vw)}}
.layout{flex:1;display:flex;min-height:0}
nav{width:172px;flex:0 0 auto;padding:12px 10px;border-right:1px solid var(--line);background:var(--card);overflow:auto}
nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:13px;font-weight:550;margin-bottom:2px}
nav a:hover{background:var(--accent-soft);color:var(--text)}
nav a[aria-current]{background:var(--accent-soft);color:var(--accent-2);font-weight:650}
nav a i{width:6px;height:6px;border-radius:2px;background:currentColor;opacity:.45;flex:0 0 auto}
nav a[aria-current] i{opacity:1}
nav .grp{font-size:11px;color:var(--faint);padding:14px 10px 6px;letter-spacing:.08em;text-transform:uppercase}
main{flex:1;overflow:auto;padding:20px 22px 40px;min-width:0}
.page{max-width:1120px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.page>.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.page>.head p{color:var(--muted);font-size:13px;flex:1;min-width:180px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.tight{padding:13px 15px}
.card.alert{border-color:var(--red);background:var(--red-soft)}
.card>h2{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card>h2 .hint{font-weight:500;font-size:12px;color:var(--faint);margin-left:auto}
.grid{display:grid;gap:12px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.stat small{color:var(--muted);font-size:12px}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
@media(max-width:850px){
  .layout{flex-direction:column;min-height:0}
  nav{display:flex;gap:4px;width:auto;padding:6px 10px;border:0;border-bottom:1px solid var(--line);overflow-x:auto}
  nav a{flex:none;padding:8px;margin:0}
  nav .grp,nav a i{display:none}
  main{padding:16px 14px 32px}
}
@media(max-width:680px){
  .split{grid-template-columns:minmax(0,1fr)}
  .brand span,#hp-ver,#hp-state{display:none}
  header{gap:8px}
  .page>.head{display:grid;gap:4px;align-items:start}
}
@media(max-width:420px){
  main{padding-inline:10px}
  .card{padding:12px}
  .row .ops{flex-shrink:1;justify-content:flex-end}
}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .field{flex:1 1 160px;min-width:130px}
.toolbar .field.narrow{flex:0 0 118px}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.toolbar .acts{flex:0 1 auto}
label.hp{white-space:normal}
main :is(a,button,summary):focus-visible,nav a:focus-visible{outline:2px solid var(--accent-2)}
.row[data-act],.pcard[data-act]{cursor:pointer}
.row[data-act]:hover,.pcard[data-act]:hover,.pcard.sel{border-color:var(--accent-2)}
.row .body .t,.pcard .nm{white-space:pre-wrap}
.card,.stat{min-width:0;overflow-wrap:anywhere}
.field-note,.muted{font-size:12px;color:var(--muted)}
.lookup-result{margin-top:12px}
.scene-filters{margin-bottom:12px}
.entry-write{margin-top:0}
.entry-write[open]>summary{margin-bottom:12px}
.entry-write>summary{font-size:15px;color:var(--text)}
#entry-editor:not([hidden])+.entry-write{margin-top:12px}
.table-wrap{overflow-x:auto}
.table-wrap table{width:100%;border-collapse:collapse}
.table-wrap :is(th,td){padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.table-wrap th{font-size:12px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--orange-soft);color:var(--orange)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.acc{background:var(--accent-soft);color:var(--accent-2)}

.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.pcard{display:flex;gap:10px;align-items:flex-start;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px}
.pcard:hover{border-color:var(--accent-2)}
.av{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);font-weight:700;font-size:13px}
.pcard .nm{font-weight:600;font-size:13px;overflow-wrap:anywhere;line-height:1.35}
.pcard .meta{font-size:11px;color:var(--faint);overflow-wrap:anywhere}

.rows{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px}
.row .body{flex:1;min-width:0}
.row .body .t{font-size:13px;overflow-wrap:anywhere}
.row .body .m{font-size:11.5px;color:var(--faint);margin-top:3px;overflow-wrap:anywhere}
.row.sel{border-color:var(--accent-2);background:var(--accent-soft)}
.row .ops{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.row.hidden{opacity:.55}

.empty{color:var(--faint);font-size:13px;padding:18px 4px;text-align:center}
details{border-top:1px dashed var(--line-2);margin-top:10px;padding-top:8px}
details>summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--faint)}
details[open]>summary::before{content:"▾ "}
pre{margin:8px 0 0;padding:10px;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto;max-height:320px;font-size:11.5px;line-height:1.55;color:var(--muted)}
.hr{height:1px;background:var(--line-2);margin:14px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}

/* 备份/恢复进度：备份 40s、整库恢复 54s，没有它用户分不清「在跑」和「卡死」 */
.job{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;background:var(--card-2)}
.job .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px}
.job .pct{font-weight:650;font-variant-numeric:tabular-nums}
.job .track{height:8px;border-radius:999px;background:var(--chip);overflow:hidden;margin:8px 0 6px;border:1px solid var(--line)}
.job .fill{height:100%;width:0;border-radius:999px;background:var(--accent);transition:width .28s linear}
.job .fill.unk{width:32%;animation:slide 1.35s ease-in-out infinite}
.job.bad .fill{background:var(--red);animation:none;width:100%}
.job.bad .pct{color:var(--red)}
.job .meta{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes slide{0%{margin-left:-32%}100%{margin-left:100%}}

/* starmap */
#star{width:100%;height:auto;display:block;border-radius:var(--radius-sm);background:radial-gradient(circle at 50% 45%,var(--accent-soft),transparent 62%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* toast */
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:40;max-width:min(420px,80vw)}
.toast{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 13px;box-shadow:var(--shadow);font-size:12.5px;animation:in .18s ease-out}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--green)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.busy{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;padding:5px 12px;border-radius:999px;z-index:50}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.section-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.section-title h2{display:flex;align-items:center;gap:8px}
.section-title .space{margin-left:auto;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.diagnostic{display:flex;align-items:flex-start;gap:8px;min-width:0}
.diagnostic code{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.acceptance-note{font-size:12px;color:var(--muted);margin-top:6px}
[hidden]{display:none!important}
.settings-section{margin:14px 0;padding:12px;min-width:0;border:1px solid var(--line);border-radius:var(--radius-sm)}
.settings-section legend{padding:0 6px;font-weight:600}
.settings-section .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.person-ref{color:var(--accent-2);text-decoration:underline;text-underline-offset:3px}
</style>
<link rel="stylesheet" href="/galaxy.css">
</head>
<body>

<div id="boot-screen">正在连接记忆库…</div>

<div id="gate" hidden>
  <div class="gate">
    <h1><span class="dot" id="gate-dot"></span>记忆库 · 本机工作台</h1>
    <p class="sub">服务端要求凭据时才会出现这一步：填入后进入。凭据只保存在本页内存；勾选下方选项才记在本机浏览器，关闭页面即清除。</p>
    <form id="gate-form">
      <div class="field">
        <label for="token">管理员凭据</label>
        <input class="inp" id="token" type="password" autocomplete="current-password" placeholder="粘贴管理凭据">
      </div>
      <div class="row" style="font-size:12.5px;color:var(--muted)">
        <input type="checkbox" id="remember"><label for="remember">在本机记住（仅此设备）</label>
      </div>
      <div class="row">
        <button class="btn primary" type="submit" id="gate-go">连接</button>
        <span id="gate-msg" style="font-size:12px;color:var(--muted)"></span>
      </div>
    </form>
    <p class="sub" style="margin-top:16px;font-size:12px;border-top:1px dashed var(--line-2);padding-top:12px">
      需要原始排障表单时用 <a href="/standalone-raw.html" target="_blank" rel="noopener">原始页</a>（同样的凭据，逐字段 JSON 操作）。
    </p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="brand">记忆库<span>本机工作台</span></div>
    <label class="hp">空间
      <select id="space"><option value="">（未读取）</option></select>
    </label>
    <span class="hp" id="hp-ver"></span>
    <div class="spacer"></div>
    <span class="hp" id="hp-state"><span class="dot"></span>已连接</span>
    <label class="hp">主题
      <select id="theme">
        <option value="auto">跟随环境</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </label>
    <button class="btn sm ghost" id="logout">退出</button>
  </header>
  <div class="layout">
    <nav id="nav" aria-label="控制台页面"></nav>
    <main id="main"></main>
  </div>
</div>

<div id="toasts" role="status" aria-live="polite"></div>
<div id="busybox"></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function freshHistoryState(){return {job:null,submitOperationId:null,submitting:false,readError:"",pollError:"",pollTimer:null,polling:false,controller:new AbortController()};}
const S={
  token:"", spaces:null, space:"", ws:null, status:null, ver:null,
  page:"overview", scope:{kind:"group",id:""},spaceEpoch:0,spaceController:new AbortController(),workspaceRequest:null,statusRequest:null,jobsRequest:null,
  person:null, personCtx:"", personSel:null, entry:null, entryPreview:null,
  scene:"", sceneFilter:"", sceneStatus:"", sceneLimit:50, subject:null, subjectSel:null, subjectSearch:null, recall:null, jobs:null,
  settings:null, backupPreview:null, restoreResult:null, busy:0, job:null, jobTimer:null, bpass:"", backupMode:"evidence",
  history:freshHistoryState(),scrollHistory:false
};
const LS_THEME="memory-console-theme", LS_TOKEN="memory-console-token", LS_SPACE="memory-console-space";
const NAV=[
  ["概览","overview"],["人物记忆","people"],["场景记忆","scene"],["关系星图","star"],
  ["记忆检索","recall"],["角色与约定","continuity"],["主体与纠正","subject"],["备份与导入","backup"],["设置","settings"]
];
const kindName={trait:"档案",speaker_profile:"画像",event:"事件",topic:"话题",promise:"承诺",joke:"梗",preference:"偏好",grudge:"芥蒂",pattern:"模式",impression:"印象",rule:"规矩",meme:"梗",term:"术语",opinion:"意见",fact:"事实"};
const scopeName={group:"群",private:"私聊",game:"游戏",channel:"频道",work:"作品",project:"项目"};

/* ---------------- infra ---------------- */
function toast(msg,kind){
  const el=document.createElement("div");
  el.className="toast"+(kind?" "+kind:"");
  el.textContent=String(msg);
  $("#toasts").append(el);
  setTimeout(()=>el.remove(),kind==="err"?7000:3600);
}
function busy(on){
  S.busy+=on?1:-1; if(S.busy<0)S.busy=0;
  syncBusyChip();
}
// 有真进度条时不再显示「处理中…」胶囊：两个提示叠在一起只会让人以为卡了两处。
function syncBusyChip(){
  const box=$("#busybox"); if(!box)return;
  box.innerHTML=(S.busy&&!S.job?.active)?'<div class="busy">处理中…</div>':"";
}
async function api(route,method="GET",body,options={}){
  if(!options.quiet)busy(true);
  try{
    const r=await fetch("/api/v1/"+route,{
      method,
      headers:{...(S.token?{authorization:"Bearer "+S.token}:{}),...(body?{"content-type":"application/json"}:{})},
      // 备份/恢复按体积能跑几分钟，30 分钟只防彻底没响应；真实进度靠进度接口，不靠这个超时。
      // 空间切换会传入 AbortSignal：旧请求即使稍后返回，也不能覆盖新空间。
      signal:options.signal||AbortSignal.timeout(route.includes('backups')?1800000:30000),
      ...(body?{body:JSON.stringify(body)}:{})
    });
    let data=null; try{data=await r.json();}catch{}
    if(!r.ok){
      const e=new Error((data&&(data.code?data.code+": ":"")+(data.error||""))||("HTTP "+r.status));
      e.status=r.status;e.code=data&&data.code;e.body=data;throw e;
    }
    return data||{};
  }catch(e){if(e.name==="TimeoutError"){const error=new Error("请求超时，请刷新重试；已提交的任务可在任务列表查看。");error.code="REQUEST_TIMEOUT";throw error;}throw e;}finally{if(!options.quiet)busy(false);}
}
const sid=()=>encodeURIComponent(S.space);

const opId=()=>crypto.randomUUID();

/* ---------------- 备份/恢复进度 ---------------- */
// 服务端在 worker 里按「已处理字节」上报真进度，前端每 500ms 读一次。不用假动画：
// 假动画在失败时会走到 99% 卡住，反而更像死机。
const JOB_POLL_MS=500;
const PHASE_NAME={scan:"扫描文件",prepare:"准备中",read:"读取并压缩",verify:"校验校验和",write:"写入磁盘",validate:"校验恢复结果",finalize:"收尾",done:"完成",failed:"失败"};
const fmtMB=n=>{const v=(Number(n)||0)/1048576;return (v>=100?v.toFixed(0):v.toFixed(1))+" MB";};
const fmtDur=ms=>{if(!Number.isFinite(ms)||ms<0)return "—";const s=Math.round(ms/1000);return s<60?s+" 秒":Math.floor(s/60)+" 分 "+(s%60)+" 秒";};
// 密码框会被 render 重建，值统一从 S.bpass 取（输入时同步），避免「备份完密码就空了」。
const bpassVal=()=>{const el=$("#bpass");return el?el.value:(S.bpass||"");};
function jobHtml(){
  const j=S.job; if(!j)return "";
  const pct=j.percent==null?null:j.percent, bad=j.phase==="failed", settled=bad||j.phase==="done";
  // 进行中显示「现在这一阶段」，结束时显示「这件事叫什么」——这两个不是一回事，
  // 混用会出现「正在准备恢复」挂到 94% 才变的情况。
  const title=settled?(j.label||PHASE_NAME[j.phase]||"处理中"):(PHASE_NAME[j.phase]||j.label||"处理中");
  const left=[j.label&&j.label!==title?j.label:null,j.total?`${fmtMB(j.done)} / ${fmtMB(j.total)}`:null];
  return `<div class="job${bad?" bad":""}">
    <div class="row"><span>${esc(title)}</span><span class="pct">${bad?"已失败":(pct==null?"进行中":pct.toFixed(1)+"%")}</span></div>
    <div class="track"><div class="fill${pct==null?" unk":""}" style="${pct==null?"":`width:${pct}%`}"></div></div>
    <div class="meta"><span>${left.filter(Boolean).map(esc).join(" · ")}</span><span>${j.active?"已用 "+fmtDur(j.elapsedMs)+(j.etaMs?" · 约剩 "+fmtDur(j.etaMs):""):"耗时 "+fmtDur(j.elapsedMs)}</span></div>
    ${bad&&j.error?`<div class="meta" style="margin-top:6px;color:var(--red)">${esc((j.error.code||"")+"："+(j.error.message||""))}</div>`:""}
  </div>`;
}
function paintJob(){const slot=$("#jobslot");if(slot)slot.innerHTML=jobHtml();syncBusyChip();}
async function probeJob(){
  const r=await fetch("/api/v1/admin/backups/progress",{headers:{...(S.token?{authorization:"Bearer "+S.token}:{})},signal:AbortSignal.timeout(8000)});
  if(!r.ok)return null;
  const d=await r.json().catch(()=>null);
  return d&&d.ok?d:null;
}
function startJobPolling(){
  if(S.jobTimer)return;
  S.jobTimer=setInterval(async()=>{
    let d=null;
    try{d=await probeJob();}catch{return;}   // 轮询本身失败不提示：备份窗口里网络抖动是常态
    if(!d)return;
    S.job=d; paintJob();
    if(!d.active){
      stopJobPolling();
      // 刷新过页面也能拿到这次生成/上传的备份 ID（进度快照里带回来了）。
      if(d.backupId&&d.backupId!==S.backupId)S.backupId=d.backupId;
      // 任务结束后把页面数据补回来：维护窗口内所有 reads 都是 503，缓存的还是旧内容。
      setTimeout(async()=>{
        try{
          // 维护窗口里 boot 拿不到空间表（见 boot 的 MAINTENANCE 分支），这里就地补上。
          if(!Object.keys(S.spaces?.spaces||{}).length){S.spaces=await api("admin/spaces");applySpaces();}
          refreshAfterMaintenance();
        }catch{}
      },250);
    }
  },JOB_POLL_MS);
}
function stopJobPolling(){if(S.jobTimer){clearInterval(S.jobTimer);S.jobTimer=null;}}
function beginJob(label){
  S.job={active:true,label,phase:"scan",done:0,total:0,percent:null,elapsedMs:0,etaMs:null,error:null};
  paintJob();startJobPolling();
}
async function endJob(){
  // 再读一次，把最后那一帧（100% 或错误码）画出来再停表。
  try{const d=await probeJob();if(d){S.job=d;paintJob();}}catch{}
  finally{stopJobPolling();}
}
async function resumeJobIfAny(){
  try{
    const d=await probeJob();
    if(d&&d.active){S.job=d;if(S.page!=="backup"){S.page="backup";location.hash="#/backup";}render();startJobPolling();return true;}
  }catch{}
  return false;
}
// 上传走 XHR 而不是 fetch：只有 XHR 能拿到上传的字节进度（fetch 的 ReadableStream 上传还没有跨浏览器支持）。
// 上传完成后服务端还要在校验线程里解压算校验和，那段由进度轮询接手显示。
function uploadBackup(file,passwordB64){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest(), startedAt=Date.now();
    xhr.open("POST","/api/v1/admin/backups");
    xhr.setRequestHeader("authorization","Bearer "+S.token);
    xhr.setRequestHeader("content-type","application/octet-stream");
    xhr.setRequestHeader("x-backup-password",passwordB64);
    xhr.upload.onprogress=e=>{
      if(!e.lengthComputable)return;
      S.job={...(S.job||{}),active:true,label:"正在上传备份",phase:"read",done:e.loaded,total:e.total,
        percent:Math.round(e.loaded/e.total*1000)/10,elapsedMs:Date.now()-startedAt,etaMs:null,error:null};
      paintJob();
      if(e.loaded>=e.total){S.job={...S.job,label:"正在校验上传的备份",phase:"verify"};paintJob();startJobPolling();}
    };
    xhr.onload=()=>{
      let d=null; try{d=JSON.parse(xhr.responseText);}catch{}
      if(xhr.status>=200&&xhr.status<300)return resolve(d||{});
      const e=new Error((d&&(d.code?d.code+": ":"")+(d.error||""))||("HTTP "+xhr.status));
      e.status=xhr.status;e.code=d&&d.code;reject(e);
    };
    xhr.onerror=()=>reject(new Error("上传中断（服务可能正在备份，稍后重试）"));
    xhr.ontimeout=()=>reject(new Error("上传超时"));
    xhr.send(file);
  });
}

function spaceReadOptions(){
  return {signal:AbortSignal.any([S.spaceController.signal,AbortSignal.timeout(30000)]),quiet:true};

function readWorkspace({refresh=false}={}){
  if(!S.space)return Promise.resolve(null);
  if(S.workspaceRequest)return S.workspaceRequest;
  if(S.ws&&!refresh)return Promise.resolve(S.ws);
  const epoch=S.spaceEpoch;
  const promise=api("spaces/"+sid()+"/workspace","POST",{action:"state"},spaceReadOptions()).then(state=>{
    if(epoch!==S.spaceEpoch)return null;
    S.ws=state;
    if(!Object.hasOwn(state.scenes||{},S.scene)){
      selectScene(Object.values(state.scenes||{})[0]?.sceneId||"");
    }
    if(S.entry)S.entry=state.entries?.[S.entry.id]||null;
    const binding=state.scenes?.[S.scene]?.bindings?.[0];
    if(binding&&!S.scope.id)S.scope={kind:binding.kind,id:binding.id};
    return state;
  }).finally(()=>{
    if(S.workspaceRequest===promise)S.workspaceRequest=null;
  });
  S.workspaceRequest=promise;
  return promise;
}
function loadOverviewStatus({refresh=false}={}){
  if(!S.space || (S.status&&!refresh))return Promise.resolve();
  if(S.statusRequest)return S.statusRequest;
  const epoch=S.spaceEpoch;
  S.degraded="";
  const promise=api("spaces/"+sid()+"/status","GET",undefined,spaceReadOptions()).then(status=>{
    if(epoch!==S.spaceEpoch)return;
    S.status=status;
    S.history.readError="";
    const {messages,entities}=status;
    if(S.anonymous&&Number.isFinite(messages)&&Number.isFinite(entities)){
      try{localStorage.setItem("overview-counts:"+S.space,JSON.stringify({messages,entities,at:Date.now()}));}catch{}

  }).catch(error=>{
    if(epoch!==S.spaceEpoch)return;
    S.degraded=error.code==="MAINTENANCE"?"备份或恢复正在进行。":error.message;
    S.history.readError=S.degraded;
    if(error.code==="MAINTENANCE")void resumeJobIfAny();
  }).finally(()=>{
    if(S.statusRequest===promise)S.statusRequest=null;
    if(epoch===S.spaceEpoch&&S.page==="overview"&&!$("#app").hidden)render();

}

function scopeOptions(){

function knownScopeOptions(kinds){

let lastDirectory, peopleByLabel, speakersByName;
function personText(text, scope=S.scope){
  if(lastDirectory!==S.ws || !peopleByLabel){
    lastDirectory=S.ws;
    peopleByLabel=new Map();
    speakersByName=new Map();
    for(const p of S.ws?.people||[]){
      peopleByLabel.set(p.label,p);
      speakersByName.set(p.name,speakersByName.has(p.name)?null:p);
      speakersByName.set(p.id,p);
    }
  }
  function link(person){
    const q=new URLSearchParams({space:S.space,id:person.id,kind:scope.kind,scope:scope.id||""});
    return `<a class="person-ref" href="#/people/card?${esc(q.toString())}" title="${esc(person.id)}">${esc(person.name)}</a>`;
  }
  return String(text??"").split(/(〔P\d+〕|(?<![A-Za-z0-9_])P\d+(?=[：:]))/g).map((part,i)=>{
    if(i%2===0){
      // A resolved speaker field can also arrive as “nickname：text” or “qq:id：text”.
      const split=i===0?part.indexOf("："):-1;
      const speaker=split>0 && speakersByName.get(part.slice(0,split));
      return speaker ? link(speaker)+esc(part.slice(split)) : esc(part);
    }
    const label=part.replace(/[〔〕]/g,""),person=peopleByLabel.get(label);
    return person ? link(person) : esc("未识别成员（"+label+"）");
  }).join("");
}

function accountOptions(query=""){

  for(const account of S.ws?.accounts||[]){

/** 场景显示名：库里的 name 常常就等于 id，直接铺出来会一屏 "group:1051103978"。
 *  有真名用真名，否则去掉渠道前缀、只留可读部分；副标题在两者相同时省略。 */
function sceneLabel(s){
  const name=String(s?.name||""), scid=String(s?.sceneId||"");
  if(name&&name!==scid)return name;
  const bare=scid.replace(/^(group|private|game|channel|work|project):/,"");
  return bare?("#"+bare):scid;
}
function sceneSub(s){
  const label=sceneLabel(s), scid=String(s?.sceneId||"");
  return label===scid?"":scid;
}

function paintOverviewJobs(){
  const bg=$("#bg"), box=$("#jobbox");
  if(!bg||!box)return;
  const st=S.status;
  const parts=[];
  if(st?.background?.lastConsolidateAt)parts.push("整理 "+new Date(st.background.lastConsolidateAt).toLocaleString());
  if(st?.background?.lastIndexAt)parts.push("索引 "+new Date(st.background.lastIndexAt).toLocaleString());
  bg.innerHTML=esc(parts.join(" · ")||(st?"尚未运行":S.degraded?"状态暂不可用":"读取中…"))+
    (st?.background?.lastError?` <span class="chip bad">最近失败：${esc(st.background.lastError.code||"")}</span>`:"");
  if(!S.jobs)return;
  const rows=S.jobs.jobs||S.jobs.items||[];
  box.innerHTML=rows.length
    ? `<div class="rows lookup-result">${rows.slice(-6).reverse().map(j=>`<div class="row"><div class="body"><div class="t">${esc(j.type||"任务")} <span class="chip">${esc(j.status||j.state||"")}</span></div><div class="m">${esc(j.startedAt?new Date(j.startedAt).toLocaleString():"")} ${j.error?"· "+esc(j.error):""}</div></div></div>`).join("")}</div>`
    : "";
}
async function loadOverviewExtra(){
  paintOverviewJobs();
  if(S.jobs||S.jobsRequest)return;
  const epoch=S.spaceEpoch;
  const request=api("spaces/"+sid()+"/jobs","GET",undefined,spaceReadOptions());
  S.jobsRequest=request;
  try{
    const jobs=await request;
    if(epoch!==S.spaceEpoch)return;
    S.jobs=jobs;
    if(S.page==="overview")paintOverviewJobs();
  }catch(error){
    const box=$("#jobbox");
    if(epoch===S.spaceEpoch&&S.page==="overview"&&box)box.textContent="任务列表读取失败："+error.message;
  }finally{
    if(S.jobsRequest===request)S.jobsRequest=null;
  }
}

const entryStates={active:{label:"已生效",style:"ok"},pending:{label:"待确认",style:"warn"},removed:{label:"已撤回",style:"bad"}};
function entryState(status){
  if(/candidate|pending|suspected/.test(status||""))return "pending";
  if(/retract|removed|tombstone/.test(status||""))return "removed";
  return "active";
}
function sceneEntries(entries){
  const query=S.sceneFilter.trim().toLocaleLowerCase();
  const matches=entries.filter(e=>(!S.sceneStatus||entryState(e.status)===S.sceneStatus) &&
    (!query||[e.text,e.kind,kindName[e.kind]].some(value=>String(value||"").toLocaleLowerCase().includes(query))));
  const count=matches.length;
  if(!count)return `<p class="empty">${entries.length?"没有符合筛选条件的条目。":"这个场景还没有条目。"}</p>`;
  return `<div class="rows">${matches.slice(0,S.sceneLimit).map(e=>{
    const {label,style}=entryStates[entryState(e.status)];
    const selected=S.entry?.id===e.id;
    return `<div class="row ${selected?"sel":""}" data-act="pick-entry" data-id="${esc(e.id)}">
      <span class="chip ${style}">${label}</span>

    </div>`;
  }).join("")}</div>
    <div class="acts lookup-result"><span class="field-note" data-entry-count>${Math.min(count,S.sceneLimit)} / ${count} 条</span>
    ${count>S.sceneLimit?'<button class="btn sm" data-act="entry-more">显示更多</button>':""}</div>`;
}

function historyProgressHtml(hi,job){

  const count=total===0?"0 条消息":determinate?`${fmtRows(done)} / ${fmtRows(total)} 行`:"进度信息暂不可用";

function paintHistory(){const slot=$("#history-index");if(slot)slot.innerHTML=historyIndexHtml();}
function announceHistory(message){
  const live=$("#history-live");if(live&&message&&live.textContent!==message)live.textContent=message;
}
async function copyText(text){
  if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);
  const area=document.createElement("textarea");area.value=text;area.style.position="fixed";area.style.opacity="0";document.body.append(area);area.select();
  const ok=document.execCommand("copy");area.remove();if(!ok)throw new Error("复制失败");
}
async function readHistoryStatus(options={}){
  const space=S.space,epoch=S.spaceEpoch,h=S.history;if(!space)return;
  if(h.controller.signal.aborted)h.controller=new AbortController();
  const controller=h.controller;
  if(h.reading===controller)return;
  h.reading=controller;
  try{
    const status=await api("spaces/"+encodeURIComponent(space)+"/status","GET",undefined,{
      ...options,signal:AbortSignal.any([controller.signal,AbortSignal.timeout(30000)])
    });
    if(space!==S.space||epoch!==S.spaceEpoch||h!==S.history||controller.signal.aborted)return;
    S.status=status;h.readError="";paintHistory();resumeHistoryJobIfAny();
  }catch(err){
    if(space!==S.space||epoch!==S.spaceEpoch||h!==S.history||controller.signal.aborted||err.name==="AbortError")return;
    h.readError=err.message;paintHistory();if(!options.quiet)toast("索引状态读取失败："+err.message,"err");
  }finally{if(h.reading===controller)h.reading=null;}
}
function resumeHistoryJobIfAny(){
  if(S.page!=="backup"||!S.space||S.history.polling)return;
  const hi=S.status?.historyIndex,h=S.history,latest=latestHistoryJob(hi);
  let job=historyJobActive(h.job)?h.job:historyJobActive(latest)?latest:null;
  const buildingId=hi?.building?.jobId||hi?.building?.id;
  if(!job&&buildingId)job={id:buildingId,status:"running"};
  if(job){h.job=job;startHistoryPolling();}
}
function startHistoryPolling(){
  const h=S.history;if(h.polling||h.pollTimer||S.page!=="backup"||!historyJobId(h.job))return;
  if(h.controller.signal.aborted)h.controller=new AbortController();
  h.polling=true;
  const schedule=delay=>{h.pollTimer=setTimeout(()=>{h.pollTimer=null;void pollHistoryJob(h,schedule);},delay);};
  schedule(0);
}
function stopHistoryPolling(abort=false){
  const h=S.history;if(!h)return;if(h.pollTimer)clearTimeout(h.pollTimer);h.pollTimer=null;h.polling=false;
  if(abort)h.controller?.abort();
}
async function pollHistoryJob(h,schedule){
  if(!h.polling||h!==S.history)return;
  const space=S.space,epoch=S.spaceEpoch,jobId=historyJobId(h.job),base="spaces/"+encodeURIComponent(space);
  const [jobResult,statusResult]=await Promise.allSettled([
    api(base+"/jobs/"+encodeURIComponent(jobId),"GET",undefined,{quiet:true,signal:h.controller.signal}),
    api(base+"/status","GET",undefined,{quiet:true,signal:h.controller.signal})
  ]);
  if(!h.polling||h!==S.history||space!==S.space||epoch!==S.spaceEpoch)return;
  if(statusResult.status==="fulfilled"){S.status=statusResult.value;h.readError="";}
  else h.readError=statusResult.reason?.message||"索引状态读取失败";
  if(jobResult.status==="fulfilled"){h.job=jobResult.value.job||jobResult.value;h.pollError="";}
  else{
    const err=jobResult.reason;h.pollError="任务进度读取失败，将保留最近状态并重试："+(err?.message||"网络错误");
    if([401,403,404].includes(err?.status)){stopHistoryPolling();paintHistory();announceHistory("历史索引任务读取失败");return;}
  }
  const status=historyJobStatus(h.job);paintHistory();
  if(status==="completed"){
    stopHistoryPolling();
    await readHistoryStatus({quiet:true});
    if(h!==S.history||space!==S.space||epoch!==S.spaceEpoch)return;
    paintHistory();announceHistory("历史索引重建完成，新索引已激活");toast("历史索引重建完成","ok");return;
  }
  if(status==="failed"){
    stopHistoryPolling();paintHistory();announceHistory("历史索引重建失败，可重新提交");toast("历史索引重建失败："+(h.job?.error?.message||"未知错误"),"err");return;
  }
  schedule(HISTORY_POLL_MS);
}
async function submitHistoryRebuild(){
  const h=S.history,hi=S.status?.historyIndex,job=h.job||latestHistoryJob(hi);
  const settled=["completed","failed"].includes(historyJobStatus(job));
  if(h.submitting||historyJobActive(job)||(!settled&&hi?.building)||S.status?.canRebuildHistoryIndex!==true)return;
  const space=S.space,epoch=S.spaceEpoch;
  if(!window.confirm(`重建 ${space} 的历史索引？`))return;
  // submitOperationId 只在「未拿到 jobId 的传输失败」后保留；人工重试已失败任务会生成新 ID。
  const operationId=h.submitOperationId||opId();h.submitOperationId=operationId;h.submitting=true;h.pollError="";paintHistory();
  if(h.controller.signal.aborted)h.controller=new AbortController();
  try{
    const result=await api("spaces/"+encodeURIComponent(space)+"/jobs","POST",{type:"history-lexical",operationId},{signal:h.controller.signal});
    if(space!==S.space||epoch!==S.spaceEpoch||h!==S.history)return;
    h.job=result.job||{id:result.jobId,status:"queued",createdAt:new Date().toISOString()};h.submitOperationId=null;
    announceHistory("历史索引重建任务已提交");toast("历史索引重建任务已提交","ok");startHistoryPolling();
  }catch(err){
    if(space!==S.space||epoch!==S.spaceEpoch||h!==S.history)return;
    const transport=!err.status||err.code==="REQUEST_TIMEOUT";
    if(!transport)h.submitOperationId=null;
    h.pollError=transport?"提交传输失败；重试会沿用同一操作 ID，避免重复任务。":"提交失败："+err.message;
    toast(h.pollError,"err");
  }finally{
    if(space===S.space&&epoch===S.spaceEpoch&&h===S.history){h.submitting=false;paintHistory();}
  }
}

$("#main").addEventListener("click",async e=>{
  if(e.target.closest(".person-ref"))return;
  const el=e.target.closest("[data-act]"); if(!el||el.disabled)return;
  const act=el.dataset.act, epoch=S.spaceEpoch, route=location.hash;
  const isCurrent=()=>epoch===S.spaceEpoch&&route===location.hash&&el.isConnected;
  const pending=["person-load","person-preview","person-op","subjects","pick-subject","subject-rev","entry-preview",
    "entry-correct","entry-retract","entry-add","scene-create","job","refresh"].includes(act);
  const panel=pending?el.closest(".page"):null;
  if(el.closest(".page")?.getAttribute("aria-busy")==="true")return;
  if(panel)panel.setAttribute("aria-busy","true");
  const button=pending?el.closest("button")||$("button",el):null;
  if(button)button.disabled=true;
  try{
    if(act==="refresh"){
      S.jobs=null;
      void loadOverviewExtra();
      await loadOverviewStatus({refresh:true});
      if(epoch===S.spaceEpoch&&S.page==="overview"&&!S.degraded)toast("已刷新","ok");
    }
    else if(act==="overview-scenes"){
      el.disabled=true;
      try{
        await readWorkspace();
        if(epoch===S.spaceEpoch&&S.page==="overview")render();
      }finally{el.disabled=false;}
    }
    else if(act==="workspace-retry"){render();}
    else if(act==="load-scope-list"){
      const status=el.nextElementSibling;
      el.disabled=true;
      status.textContent="正在加载会话…";
      try{
        await readWorkspace();
        if(!isCurrent())return;
        document.getElementById(el.dataset.target).innerHTML=personScopeOptions();
        status.textContent=scopeOptions().length?"可从会话 ID 的建议中选择。":"暂无已知会话，可以手填会话 ID。";
        el.remove();
      }catch(error){
        if(isCurrent())status.textContent="会话读取失败："+error.message;
      }finally{el.disabled=false;}
    }
    else if(act==="recall-scopes"){
      const status=$("#recall-scopes-status");
      el.disabled=true;
      status.textContent="正在加载会话…";
      try{
        await readWorkspace();
        if(!isCurrent())return;
        const choices=$("#recall-saved"),known=knownScopeOptions(recallKinds);
        choices.innerHTML='<option value="">选择会话</option>'+known;
        choices.closest(".field").hidden=!known;
        status.textContent=known?"":"暂无已知会话，可以手填会话 ID。";
        el.remove();
        if(known)choices.focus({preventScroll:true});
      }catch(error){
        if(isCurrent())status.textContent="会话读取失败："+error.message;
      }finally{el.disabled=false;}
    }
    else if(act==="people-retry"){
      el.disabled=true;
      await loadPeopleDirectory($("#actor"));
    }
    else if(act==="open-history"){
      S.scrollHistory=true;
      if(S.page==="backup")render();else location.hash="#/backup";
    }
    else if(act==="history-rebuild"){await submitHistoryRebuild();}
    else if(act==="history-refresh"){await readHistoryStatus();}
    else if(act==="history-copy"){
      const value=S.status?.historyIndex?.[el.dataset.field];if(value==null)throw new Error("没有可复制的诊断信息");
      await copyText(diagnosticValue(value));toast("已复制完整内容","ok");
    }
    else if(act==="job"){
      const type=el.dataset.type;
      const r=await api("spaces/"+sid()+"/jobs","POST",{type});
      if(!isCurrent())return;
      toast("任务已提交："+type,"ok");
      const box=$("#jobbox"); if(box)box.innerHTML=`<pre>${esc(JSON.stringify(r,null,2))}</pre>`;
    }
    else if(act==="person-load"){
      const input=$("#actor");
      if(el.dataset.account)input.value=el.dataset.account;
      const name=input.value.trim();
      if(!name){input.focus();throw new Error("请输入昵称或账号");}
      if(!S.ws&&!/^(?:qq:)?\d+$/i.test(name)){
        try{await readWorkspace();}catch{}
        if(!isCurrent())return;
      }
      const accounts=S.ws?.accounts||[];
      const matches=accounts.filter(a=>a.displayName===name);
      if(!accounts.some(a=>a.id===name)&&matches.length>1)throw new Error("有多个相同昵称，请从输入框建议中选择账号");

    else if(act==="person-preview"){

      const target={key:item.key,itemKey:item.itemKey};
      const preview=S.personPreview||await api(path,"POST",{actorId,scope,allScopes,action:"preview",target});
      if(!isCurrent())return;
      await api(path,"POST",{actorId,scope,allScopes,action:"revision",operationId:opId(),

    else if(act==="scene-recall"){
      const binding=(S.ws?.scenes?.[S.scene]?.bindings||[]).find(b=>recallKinds.includes(b.kind)&&b.id);

      await readWorkspace({refresh:true});
      if(!isCurrent())return;
      S.entry=correcting?S.ws?.entries?.[entry.id]||null:null;S.entryPreview=null;
      render();toast(correcting?"已保存纠正":"已撤回","ok");
    }
    else if(act==="subjects"){
      const scope={kind:$("#kscope").value,id:$("#iscope").value.trim()};
      const query=$("#sq").value.trim();
      const d=await api("spaces/"+sid()+"/subjects?"+new URLSearchParams({scopeKind:scope.kind,scopeId:scope.id,q:query}));
      if(!isCurrent())return;
      S.scope=scope;
      S.subjectSearch={scope,query,items:d.subjects||[]};
      S.subject=null;S.subjectSel=null;
      render();
      $("#sq")?.focus({preventScroll:true});
    }
    else if(act==="pick-subject"){
      const {scope}=S.subjectSearch;
      const d=await api("spaces/"+sid()+"/subjects/"+encodeURIComponent(el.dataset.id)+"?"+new URLSearchParams({scopeKind:scope.kind,scopeId:scope.id}));
      if(!isCurrent())return;
      S.subject=d;S.subjectSel=null;render();
      $("#subject-detail")?.scrollIntoView({block:"nearest"});
    }
    else if(act==="pick-obs"){
      S.subjectSel=(S.subject.observations||[]).find(o=>o.id===el.dataset.id)||null; render();
    }
    else if(act==="subject-rev"){
      if(!S.subject||!S.subjectSel)throw new Error("先选观察");
      const mode=el.dataset.mode, {scope}=S.subjectSearch;
      const path="spaces/"+sid()+"/subjects/"+encodeURIComponent(S.subject.subject.id);
      const statement=$("#sfix").value.trim();
      if(mode==="correct"&&!statement){$("#sfix").focus();throw new Error("请填写纠正后的内容");}
      await api(path+"/revisions","POST",{
        operationId:opId(),scope,action:mode,observationId:S.subjectSel.id,expectedRev:S.subjectSel.rev,
        statement,reason:$("#sreason").value.trim()||"管理员纠正"});
      if(!isCurrent())return;
      const d=await api(path+"?"+new URLSearchParams({scopeKind:scope.kind,scopeId:scope.id}));
      if(!isCurrent())return;
      S.subject=d;S.subjectSel=null;render(); toast(mode==="correct"?"已纠正":"已撤回","ok");
    }
    else if(act==="backup-full"||act==="backup-space"){
      const password=bpassVal()||undefined;
      // 先挡住明显的填错：服务端只说「密码至少 8 位」，用户要等一轮请求才知道。
      // 空间导出允许不加密（密码留空），服务级备份必须给密码（它含 access.json）。
      if(act==="backup-full"&&(!password||password.length<8))throw new Error("服务级备份密码至少 8 位");
      const mode=S.backupMode==="full"?"full":"evidence";
      beginJob((act==="backup-space"?"正在导出空间备份":(mode==="evidence"?"正在导出证据级备份":"正在生成完整镜像")));
      try{
        const r=await api("admin/backups","POST",{...(act==="backup-space"?{spaceId:S.space}:{}),password,mode});
        S.backupId=r.backupId; toast("备份已生成："+r.backupId,"ok");
      }finally{ await endJob(); render(); }
    }
    else if(act==="backup-download"){
      const idv=$("#bid").value.trim(); if(!idv)throw new Error("填备份 ID");
      const r=await fetch("/api/v1/admin/backups/"+encodeURIComponent(idv),{headers:{authorization:"Bearer "+S.token}});
      if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||("HTTP "+r.status));}
      const url=URL.createObjectURL(await r.blob()),a=document.createElement("a");
      a.href=url;a.download=idv+".vmb";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
      toast("开始下载","ok");
    }
    else if(act==="backup-preview"){
      const idv=$("#bid").value.trim(); if(!idv)throw new Error("填备份 ID");
      const pwx=bpassVal();
      if(S.backupPreview?.id!==idv)S.restoreResult=null;
      S.backupPreview=null;
      beginJob("正在校验备份");
      try{
        S.backupPreview=await api("admin/backups/"+encodeURIComponent(idv)+"/preview","POST",{password:pwx});
        S.backupPreview.id=idv; toast("预览通过","ok");
      }catch(err){
        // 最常见的失败是「密码框被清空后直接点预览」。别让用户以为是文件坏了。
        if(err.code==="INVALID_BACKUP"&&!pwx)throw new Error("校验失败：密码为空。加密备份必须填导出时用的密码");
        throw err;
      }finally{ await endJob(); render(); }
    }
    else if(act==="backup-upload"){
      const f=$("#bfile").files[0]; if(!f)throw new Error("选文件");
      const pw=btoa(String.fromCharCode(...new TextEncoder().encode(bpassVal())));
      beginJob("正在上传备份");
      try{
        const r=await uploadBackup(f,pw);
        S.backupId=r.backupId; toast("已上传："+r.backupId,"ok");
      }finally{ await endJob(); render(); }
    }
    else if(act==="backup-restore"){
      const p=S.backupPreview; if(!p)throw new Error("先预览");
      beginJob("正在准备恢复");
      try{
        const r=await api("admin/backups/"+encodeURIComponent(p.id)+"/restore","POST",{
          password:bpassVal(),expectedChecksum:p.checksum,
          spaceId:$("#bnew").value.trim()||undefined,owner:$("#bowner").value.trim()||undefined,replace:$("#breplace").checked});
        S.restoreResult={...r,archivePreview:p};
        // 文件路径只保留在内存中供验收判断，不拼进任务提示，也不写浏览器日志。
        toast("恢复完成"+(r.evidenceOnly?"（证据级：可读可召回，不能重建索引）":""),"ok");
        S.backupPreview=null;
      }finally{await endJob();refreshAfterMaintenance();}
    }
    else if(act==="settings-load"){
      S.settings=await api("admin/spaces/"+sid()+"/settings"); render(); toast("已读取设置","ok");
    }
    else if(act==="settings-save"){
      const patch={};
      $$("[data-setting]").forEach(el=>{
        const k=el.dataset.setting;
        if(el.type==="checkbox"){patch[k]=el.checked;return;}
        const raw=el.value.trim();
        if(raw==="")return;
        if(el.type==="number"){const n=Number(raw); if(Number.isFinite(n))patch[k]=n; return;}
        patch[k]=raw;
      });
      await api("admin/spaces/"+sid()+"/settings","PUT",{patch});
      S.settings=await api("admin/spaces/"+sid()+"/settings"); render(); toast("已保存 "+Object.keys(patch).length+" 项","ok");
    }
    else if(act==="project-create"){
      const projectId=$("#nproj").value.trim(); if(!projectId)throw new Error("填项目 ID");
      const r=await api("admin/projects","POST",{projectId});
      S.spaces=await api("admin/spaces"); render();
      toast("项目已创建，凭据只显示这一次："+r.token,"ok");
    }
    else if(act==="space-create"){
      const spaceId=$("#nspace").value.trim(), owner=$("#nowner").value.trim();
      if(!spaceId||!owner)throw new Error("填空间 ID 与项目");
      await api("admin/spaces","POST",{spaceId,owner});
      S.spaces=await api("admin/spaces"); applySpaces(); render(); toast("空间已创建","ok");
    }
    else if(act==="readers-save"){
      const ids=$("#readers").value.split(",").map(x=>x.trim()).filter(Boolean);
      await api("admin/spaces/"+sid()+"/readers","PUT",{projectIds:ids});
      S.spaces=await api("admin/spaces"); render(); toast("授权已保存","ok");
    }
  }catch(err){
    // 维护态不是用户的错，也不该显示成一段英文错误 —— 直接把进度条接回来。
    if(err.code==="MAINTENANCE"){ await resumeJobIfAny(); toast("备份/恢复正在进行，进度见上方","err"); return; }
    if(isCurrent())toast(err.message+(err.status?" · HTTP "+err.status:""),"err");
  }finally{
    panel?.removeAttribute("aria-busy");
    if(button)button.disabled=false;
  }
});
$("#main").addEventListener("toggle",e=>{
  const details=e.target;
  const source=details.dataset.json;
  if(!details.open||!source)return;
  const pre=$("pre",details);
  if(!pre.textContent)pre.textContent=JSON.stringify(S[source],null,2);
},true);
$("#main").addEventListener("submit",async e=>{
  const form=e.target;
  if(form.dataset.lookup!=="recall")return;
  e.preventDefault();
  const button=$('button[type="submit"]',form), status=$("#recall-status",form);
  if(button.disabled)return;
  const query=$("#q",form).value.trim();
  const scope={kind:$("#rk",form).value,id:$("#ri",form).value.trim()};
  if(!query||!scope.id){
    status.textContent=!query?"请填写查询内容。":"请填写会话 ID。";
    $(!query?"#q":"#ri",form).focus();
    return;
  }
  S.lastQuery=query;
  S.scope=scope;
  button.disabled=true;
  status.textContent="正在检索…";
  try{
    const reply=await api("spaces/"+sid()+"/recall","POST",{query,scope,purpose:"query"},{quiet:true});
    if(!form.isConnected)return;
    S.recall=reply; S.recallScope=scope; S.recallQuery=query;
    $("#recall-results").innerHTML=recallResults();
    status.textContent="检索完成";
  }catch(error){
    if(form.isConnected)status.textContent="检索失败："+error.message;
  }finally{button.disabled=false;}
});
$("#main").addEventListener("change",e=>{
  if(e.target.id==="rk"){const known=$("#recall-saved");if(known)known.value="";}
  if(e.target.closest(".page")?.getAttribute("aria-busy")==="true"){
    if(e.target.id==="pitem")e.target.value=S.personSel?.item?[S.personSel.item.key,S.personSel.item.itemKey].join("||"):"";
    if(e.target.id==="scenesel")e.target.value=S.scene;
    if(e.target.matches("#pitem,#scenesel"))return;
  }
  if(e.target.id==="entry-status"){S.sceneStatus=e.target.value;S.sceneLimit=50;updateSceneList();return;}
  const el=e.target.closest("[data-change]"); if(!el)return;
  if(el.dataset.change==="recall-scope"&&el.value){
    const [kind,id]=JSON.parse(el.value);
    $("#rk").value=kind;
    $("#ri").value=id;
  }
  if(el.dataset.change==="scene-pick"){
    selectScene(el.value);
    history.replaceState(null,"","#/scene?scene="+encodeURIComponent(el.value));
    render();
    $("#scenesel")?.focus({preventScroll:true});
  }
  if(el.dataset.change==="pick-item"){
    const [key,itemKey]=String(el.value).split("||");
    S.personSel.item=el.value?{key,itemKey}:null; S.personPreview=null;
    $("#pedit").innerHTML=personEditor();
    $("#pitem").focus({preventScroll:true});
    for(const card of $$("#main [data-act=pick-person]"))
      card.classList.toggle("sel",card.dataset.key===key&&card.dataset.item===itemKey);
  }
});
$("#main").addEventListener("input",e=>{
  if(e.target.id==="actor"&&S.ws)$("#accounts").innerHTML=accountOptions(e.target.value);
  if(e.target.id==="ri") {const known=$("#recall-saved");if(known)known.value="";}
  if(e.target.id==="entry-search"){S.sceneFilter=e.target.value;S.sceneLimit=50;updateSceneList();}
  // 密码存在内存里跟着页面走（不写进 HTML）：备份/预览/恢复三步用的是同一个密码。
  if(e.target.id==="bpass")S.bpass=e.target.value;
  // radio 没有 data-input，单独认：模式要跨 render 保持（否则刷新一下就被重置成证据级）。
  if(e.target.name==="bmode")S.backupMode=e.target.value;
});
$("#main").addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing)return;
  const id=e.target.id;
  if(id==="actor"){e.preventDefault();$('[data-act="person-load"]')?.click();}
  if(id==="sq"){e.preventDefault();$('[data-act="subjects"]')?.click();}
});
function curPersonItem(){
  const sel=S.personSel?.item; if(!sel||!S.person)return null;
  return [...S.person.profiles,...S.person.impressions].find(i=>i.key===sel.key&&i.itemKey===sel.itemKey)||null;
}

/* ---------------- boot ---------------- */
function hideBoot(){const b=$("#boot-screen");if(b)b.hidden=true;}
function showGate(msg){
  hideBoot();
  $("#gate").hidden=false; $("#app").hidden=true;
  if(msg)$("#gate-msg").textContent=msg;
}
// 本机单人使用：默认不要凭据。服务端带 --no-auth 时，未携带凭据的回环请求就是管理员，
// 所以这里先直接开门；只有服务端明确回 401（即没开 --no-auth）才回退到凭据表单。
(async function boot(){
  try{
    S.spaces=await api("admin/spaces");
    S.anonymous=true;
    await enter();
    return;
  }catch(err){
    // 备份/恢复期间服务只读，读取空间表会 503。这时把用户丢到凭据页是错的 —— 他既没登出、
    // 也没被拒绝，只是有任务在跑。直接进主界面（空间表稍后补），并接回进度条。
    if(err.code==="MAINTENANCE"){
      S.spaces={spaces:{},projects:[]};
      S.anonymous=true;
      await enter();
      return;
    }
    if(err.status&&err.status!==401){showGate("服务未就绪："+err.message);return;}
    if(!err.status){showGate("连不上服务（"+location.origin+"）");$("#gate-dot").classList.add("off");return;}
  }
  const saved=localStorage.getItem(LS_TOKEN);
  if(saved){
    S.token=saved;
    try{
      S.spaces=await api("admin/spaces");
      $("#remember").checked=true;
      await enter();
      return;
    }catch(e){S.token="";localStorage.removeItem(LS_TOKEN);}
  }
  showGate("");
  try{
    const r=await fetch("/health",{signal:AbortSignal.timeout(2500)});
    $("#gate-dot").classList.toggle("off",!r.ok);
  }catch{$("#gate-dot").classList.add("off");}
})();
</script>
